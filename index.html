<title>Painel de postagens</title>
<style>
:root{--bg:#f4f3f1;--card:#fff;--ink:#16151a;--sub:#6b6872;--line:#e6e3df;--red:#E0161B;--ok:#1f8a4c;--okbg:#e7f5ec;--warn:#b45309;--warnbg:#fdf0e1;--wait:#4b5563;--waitbg:#eef0f3;--chip:#efedea}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e10;--card:#18181b;--ink:#f2f2f3;--sub:#9a9aa3;--line:#2a2a2f;--okbg:#10291b;--warnbg:#2e1f0c;--waitbg:#222228;--chip:#232328}}
:root[data-theme="dark"]{--bg:#0e0e10;--card:#18181b;--ink:#f2f2f3;--sub:#9a9aa3;--line:#2a2a2f;--okbg:#10291b;--warnbg:#2e1f0c;--waitbg:#222228;--chip:#232328}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:0 16px 40px;max-width:720px;margin:0 auto}
header{padding:20px 0 12px}
h1{font-size:20px;font-weight:800;letter-spacing:-.2px}
h1 span{color:var(--red)}
.sub{color:var(--sub);font-size:13px;margin-top:2px}
.prox{background:var(--ink);color:var(--bg);border-radius:16px;padding:16px;margin:14px 0 10px;display:flex;gap:14px;align-items:center}
.prox img{width:58px;height:80px;object-fit:cover;border-radius:8px;flex:none;background:#333}
.prox .k{font-size:12px;opacity:.7;text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.prox .v{font-size:18px;font-weight:800;margin:2px 0}
.prox .r{font-size:13px;opacity:.85;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px}
.stat small{color:var(--sub);font-size:12px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:4px 0 14px}
.bar i{display:block;height:100%;background:var(--red)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;position:sticky;top:0;background:var(--bg);z-index:3;padding-top:8px}
.tabs button{border:0;background:var(--chip);color:var(--ink);padding:8px 14px;border-radius:20px;font:600 14px inherit;white-space:nowrap;cursor:pointer}
.tabs button.on{background:var(--red);color:#fff}
.dias{display:flex;gap:6px;overflow-x:auto;padding:8px 0 6px;position:sticky;top:44px;background:var(--bg);z-index:3;scrollbar-width:none}
.dias::-webkit-scrollbar{display:none}
.dias button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:6px 0;width:52px;text-align:center;cursor:pointer;font:inherit}
.dias button small{display:block;font-size:11px;color:var(--sub);text-transform:uppercase;font-weight:700}
.dias button b{display:block;font-size:18px;line-height:1.1}
.dias button i{display:block;font-style:normal;font-size:10px;color:var(--sub);margin-top:1px}
.dias button.hj{border-color:var(--red)}
.dias button.hj small{color:var(--red)}
.dias button.on{background:var(--red);border-color:var(--red);color:#fff}
.dias button.on small,.dias button.on i{color:#fff}
.dias button.feito i{color:var(--ok)}
.dias button.on.feito i{color:#fff}
.dias button{position:relative}
.dias button.lem::after{content:'';position:absolute;top:5px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.dias button.on.lem::after{background:#fff}
.aviso{background:var(--warnbg);color:var(--warn);border:1px solid var(--warn);border-radius:14px;padding:12px 14px;margin:12px 0 0;font-size:14px}
.aviso b{display:block;font-size:15px;margin-bottom:2px}
.lemb{background:var(--warnbg);border:1px solid var(--warn);border-radius:14px;padding:12px;margin-bottom:8px;color:var(--warn);font-size:14px}
.lemb b{display:block;font-size:15px;margin-bottom:3px}
.dia{margin-top:18px}
.dia h2{font-size:14px;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px}
.dia h2.hoje{color:var(--red)}
.it{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px;align-items:center}
.it img{width:46px;height:62px;object-fit:cover;border-radius:7px;flex:none;background:var(--line)}
.it .c{flex:1;min-width:0}
.it .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.it .hr{font-weight:800;font-size:15px}
.tp{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;padding:2px 7px;border-radius:6px;background:var(--chip)}
.tp.reel{background:#fde2e2;color:#9f1218}.tp.story,.tp.story_video{background:#e5e9ff;color:#2f3fa8}.tp.carrossel{background:#fff1d6;color:#8a5a00}.tp.imagem{background:#e6f4ea;color:#1d6b3a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tp.reel{background:#3a1416;color:#ff9a9e}:root:not([data-theme="light"]) .tp.story,:root:not([data-theme="light"]) .tp.story_video{background:#1c2142;color:#a9b4ff}:root:not([data-theme="light"]) .tp.carrossel{background:#36290c;color:#ffd27a}:root:not([data-theme="light"]) .tp.imagem{background:#13301d;color:#8fe0ac}}
.it .r{font-size:13px;color:var(--sub);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.st{font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px;margin-left:auto;white-space:nowrap}
.st.ok{background:var(--okbg);color:var(--ok)}.st.wait{background:var(--waitbg);color:var(--wait)}.st.late{background:var(--warnbg);color:var(--warn)}.st.skip{background:var(--waitbg);color:var(--sub)}
.lk{display:inline-block;margin-top:5px;font-size:13px;font-weight:700;color:var(--red);text-decoration:none}
.vazio{color:var(--sub);text-align:center;padding:30px 0}
footer{color:var(--sub);font-size:12px;text-align:center;margin-top:24px}
</style></head><body>

<script>
const D=JSON.parse(document.getElementById('dados').textContent);
const TIPO={story:'Story',story_video:'Story vídeo',imagem:'Feed',carrossel:'Carrossel',reel:'Reel'};
const DS=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const brt=d=>new Date(d.getTime()-3*3600e3); // Brasília = UTC-3 (sem horário de verão)
const dia=s=>s.slice(0,10), hm=iso=>{const b=brt(new Date(iso));return String(b.getUTCHours()).padStart(2,'0')+':'+String(b.getUTCMinutes()).padStart(2,'0')};
let filtro='hoje';try{filtro=localStorage.getItem('f')||'hoje'}catch(e){}
function status(i,agora){
  if(i.s==='publicado')return['ok','✓ Publicado '+hm(i.e)];
  if(i.s==='pulado_atraso')return['skip','Pulado'];
  const q=new Date(i.q);
  if(agora-q>40*60e3)return['late','Atrasado'];
  if(agora>=q)return['wait','Saindo agora'];
  return['wait','Agendado'];
}
function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.textContent=h;return e}
function render(){
  const agora=new Date(),hoje=brt(agora).toISOString().slice(0,10);
  const it=D.itens;
  const AV=document.getElementById('avisos');AV.innerHTML='';
  for(const l of (D.lembretes||[])){if(hoje>=l.aviso_desde&&hoje<=l.vence){
    const falta=Math.round((new Date(l.vence+'T12:00:00Z')-new Date(hoje+'T12:00:00Z'))/864e5);
    const a=el('div','aviso');a.append(el('b','','Lembrete: '+l.titulo),el('span','',l.texto+(falta>=0?' (vence em '+falta+(falta===1?' dia)':' dias)'):'')));AV.append(a)}}
  const pubs=it.filter(i=>i.s==='publicado').length;
  document.getElementById('sPub').textContent=pubs;
  document.getElementById('sFal').textContent=it.filter(i=>!i.s).length;
  document.getElementById('sHoje').textContent=it.filter(i=>dia(i.h)===hoje).length;
  document.getElementById('barra').style.width=(100*pubs/it.length)+'%';
  const g=new Date(D.gerado);
  document.getElementById('atual').textContent='Última atualização do robô: '+hm(D.gerado)+' · '+brt(g).toISOString().slice(8,10)+'/'+brt(g).toISOString().slice(5,7);
  const prox=it.find(i=>!i.s&&new Date(i.q)>agora-40*60e3);
  const P=document.getElementById('prox');P.innerHTML='';
  if(prox){const mins=Math.round((new Date(prox.q)-agora)/60e3);
    if(prox.m){const im=el('img');im.src=prox.m;im.alt='';P.append(im)}
    const c=el('div');c.append(el('div','k','Próxima postagem'));
    const quando=dia(prox.h)===hoje?'hoje':prox.h.slice(8,10)+'/'+prox.h.slice(5,7);
    c.append(el('div','v',prox.h.slice(11)+' '+quando+' · '+TIPO[prox.t]+(mins>0?' · em '+(mins>=60?Math.floor(mins/60)+'h'+String(mins%60).padStart(2,'0'):mins+' min'):'')));
    c.append(el('div','r',prox.r));P.append(c);
  }else{P.append(el('div','v','Todas as postagens foram concluídas'))}
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.f===filtro));
  let lista=it;
  if(filtro==='hoje')lista=it.filter(i=>dia(i.h)===hoje);
  if(filtro==='prox')lista=it.filter(i=>!i.s);
  if(filtro==='pub')lista=it.filter(i=>i.s==='publicado').slice().reverse();
  if(filtro.startsWith('dia:'))lista=it.filter(i=>dia(i.h)===filtro.slice(4));
  desenharDias(hoje);
  const L=document.getElementById('lista');L.innerHTML='';
  if(!lista.length){L.append(el('div','vazio',filtro==='hoje'?'Nada programado para hoje.':'Nada por aqui ainda.'));return}
  let atual='',bloco;
  for(const i of lista){
    const d=dia(i.h);
    if(d!==atual){atual=d;bloco=el('section','dia');const dt=new Date(d+'T12:00:00Z');
      bloco.append(el('h2',d===hoje?'hoje':'',(d===hoje?'Hoje · ':'')+DS[dt.getUTCDay()]+', '+d.slice(8,10)+'/'+d.slice(5,7)));L.append(bloco)}
    if(!bloco.dataset.lem){bloco.dataset.lem=1;for(const l of (D.lembretes||[]))if(l.dia===d){const k=el('div','lemb');k.append(el('b','','Lembrete: '+l.titulo),el('span','',l.texto));bloco.append(k)}}
    const c=el('div','it');
    const im=el('img');if(i.m)im.src=i.m;im.alt='';im.loading='lazy';c.append(im);
    const b=el('div','c'),top=el('div','top');
    top.append(el('span','hr',i.h.slice(11)),el('span','tp '+i.t,TIPO[i.t]));
    const [cl,tx]=status(i,agora);top.append(el('span','st '+cl,tx));
    b.append(top,el('div','r',i.r));
    if(i.l){const a=el('a','lk','Ver no Instagram →');a.href=i.l;a.target='_blank';a.rel='noopener';b.append(a)}
    c.append(b);bloco.append(c);
  }
}
function desenharDias(hoje){
  const C=document.getElementById('dias');
  const dias=[...new Set(D.itens.map(i=>dia(i.h)))];
  if(!C.childElementCount){
    const AB=['dom','seg','ter','qua','qui','sex','sáb'];
    for(const d of dias){const b=document.createElement('button');b.dataset.f='dia:'+d;
      const dt=new Date(d+'T12:00:00Z');b.append(el('small','',AB[dt.getUTCDay()]),el('b','',d.slice(8,10)),el('i'));C.append(b)}
    C.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;filtro=b.dataset.f;try{localStorage.setItem('f',filtro)}catch(x){}render()});
  }
  C.querySelectorAll('button').forEach(b=>{const d=b.dataset.f.slice(4);const doDia=D.itens.filter(i=>dia(i.h)===d);
    const feitos=doDia.filter(i=>i.s==='publicado').length;
    b.querySelector('i').textContent=feitos+'/'+doDia.length;
    b.classList.toggle('feito',feitos===doDia.length);b.classList.toggle('lem',(D.lembretes||[]).some(l=>l.dia===d));b.classList.toggle('hj',d===hoje);
    b.classList.toggle('on',filtro==='dia:'+d||(filtro==='hoje'&&d===hoje))});
  if(!C.dataset.rolou){const alvo=C.querySelector('button.on')||C.querySelector('button.hj');
