<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Painel de postagens</title>
<style>
:root{--bg:#f4f3f1;--card:#fff;--ink:#16151a;--sub:#6b6872;--line:#e6e3df;--red:#E0161B;--ok:#1f8a4c;--okbg:#e7f5ec;--warn:#b45309;--warnbg:#fdf0e1;--wait:#4b5563;--waitbg:#eef0f3;--chip:#efedea}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e10;--card:#18181b;--ink:#f2f2f3;--sub:#9a9aa3;--line:#2a2a2f;--okbg:#10291b;--warnbg:#2e1f0c;--waitbg:#222228;--chip:#232328}}
:root[data-theme="dark"]{--bg:#0e0e10;--card:#18181b;--ink:#f2f2f3;--sub:#9a9aa3;--line:#2a2a2f;--okbg:#10291b;--warnbg:#2e1f0c;--waitbg:#222228;--chip:#232328}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:0 16px 40px;max-width:720px;margin:0 auto}
header{padding:20px 0 12px}
h1{font-size:20px;font-weight:800;letter-spacing:-.2px}
h1 span{color:var(--red)}
.sub{color:var(--sub);font-size:13px;margin-top:2px}
.prox{background:var(--ink);color:var(--bg);border-radius:16px;padding:16px;margin:14px 0 10px;display:flex;gap:14px;align-items:center}
.prox img{width:58px;height:80px;object-fit:cover;border-radius:8px;flex:none;background:#333}
.prox .k{font-size:12px;opacity:.7;text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.prox .v{font-size:18px;font-weight:800;margin:2px 0}
.prox .r{font-size:13px;opacity:.85;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px}
.stat small{color:var(--sub);font-size:12px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:4px 0 14px}
.bar i{display:block;height:100%;background:var(--red)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;position:sticky;top:0;background:var(--bg);z-index:3;padding-top:8px}
.tabs button{border:0;background:var(--chip);color:var(--ink);padding:8px 14px;border-radius:20px;font:600 14px inherit;white-space:nowrap;cursor:pointer}
.tabs button.on{background:var(--red);color:#fff}
.dias{display:flex;gap:6px;overflow-x:auto;padding:8px 0 6px;position:sticky;top:44px;background:var(--bg);z-index:3;scrollbar-width:none}
.dias::-webkit-scrollbar{display:none}
.dias button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:6px 0;width:52px;text-align:center;cursor:pointer;font:inherit}
.dias button small{display:block;font-size:11px;color:var(--sub);text-transform:uppercase;font-weight:700}
.dias button b{display:block;font-size:18px;line-height:1.1}
.dias button i{display:block;font-style:normal;font-size:10px;color:var(--sub);margin-top:1px}
.dias button.hj{border-color:var(--red)}
.dias button.hj small{color:var(--red)}
.dias button.on{background:var(--red);border-color:var(--red);color:#fff}
.dias button.on small,.dias button.on i{color:#fff}
.dias button.feito i{color:var(--ok)}
.dias button.on.feito i{color:#fff}
.dias button{position:relative}
.dias button.lem::after{content:'';position:absolute;top:5px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.dias button.on.lem::after{background:#fff}
.aviso{background:var(--warnbg);color:var(--warn);border:1px solid var(--warn);border-radius:14px;padding:12px 14px;margin:12px 0 0;font-size:14px}
.aviso b{display:block;font-size:15px;margin-bottom:2px}
.lemb{background:var(--warnbg);border:1px solid var(--warn);border-radius:14px;padding:12px;margin-bottom:8px;color:var(--warn);font-size:14px}
.lemb b{display:block;font-size:15px;margin-bottom:3px}
.dia{margin-top:18px}
.dia h2{font-size:14px;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px}
.dia h2.hoje{color:var(--red)}
.it{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px;align-items:center}
.it img{width:46px;height:62px;object-fit:cover;border-radius:7px;flex:none;background:var(--line)}
.it .c{flex:1;min-width:0}
.it .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.it .hr{font-weight:800;font-size:15px}
.tp{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;padding:2px 7px;border-radius:6px;background:var(--chip)}
.tp.reel{background:#fde2e2;color:#9f1218}.tp.story,.tp.story_video{background:#e5e9ff;color:#2f3fa8}.tp.carrossel{background:#fff1d6;color:#8a5a00}.tp.imagem{background:#e6f4ea;color:#1d6b3a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tp.reel{background:#3a1416;color:#ff9a9e}:root:not([data-theme="light"]) .tp.story,:root:not([data-theme="light"]) .tp.story_video{background:#1c2142;color:#a9b4ff}:root:not([data-theme="light"]) .tp.carrossel{background:#36290c;color:#ffd27a}:root:not([data-theme="light"]) .tp.imagem{background:#13301d;color:#8fe0ac}}
.it .r{font-size:13px;color:var(--sub);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.st{font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px;margin-left:auto;white-space:nowrap}
.st.ok{background:var(--okbg);color:var(--ok)}.st.wait{background:var(--waitbg);color:var(--wait)}.st.late{background:var(--warnbg);color:var(--warn)}.st.skip{background:var(--waitbg);color:var(--sub)}
.lk{display:inline-block;margin-top:5px;font-size:13px;font-weight:700;color:var(--red);text-decoration:none}
.vazio{color:var(--sub);text-align:center;padding:30px 0}
.it{cursor:pointer;transition:transform .12s}.it:active{transform:scale(.985)}
/* visualizador da postagem (como vai ficar no Instagram) */
.vw{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:50;display:none;flex-direction:column;align-items:center;overflow-y:auto;-webkit-overflow-scrolling:touch}
.vw.on{display:flex}
.vw-top{position:sticky;top:0;width:100%;max-width:480px;display:flex;align-items:center;gap:10px;padding:12px 14px;color:#fff;z-index:2;background:linear-gradient(rgba(0,0,0,.85),rgba(0,0,0,0))}
.vw-top .q{flex:1;font-size:13px;line-height:1.3}.vw-top .q b{display:block;font-size:15px}
.vw-btn{border:0;background:rgba(255,255,255,.14);color:#fff;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none}
.vw-btn svg{width:22px;height:22px}
.vw-btn:disabled{opacity:.3}
.post{width:100%;max-width:480px;background:#fff;color:#111;margin-bottom:24px}
.post-h{display:flex;align-items:center;gap:10px;padding:10px 12px}
.post-h img{width:34px;height:34px;border-radius:50%;object-fit:cover}
.post-h b{font-size:14px}.post-h small{display:block;color:#737373;font-size:12px}
.carr{position:relative;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;background:#000}
.carr::-webkit-scrollbar{display:none}
.carr img{flex:none;width:100%;aspect-ratio:4/5;object-fit:contain;scroll-snap-align:center;background:#000}
.ccont{position:relative}
.cont{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:700;padding:3px 9px;border-radius:12px;z-index:2}
.dots{display:flex;justify-content:center;gap:4px;padding:8px 0 0}.dots i{width:6px;height:6px;border-radius:50%;background:#c7c7c7}.dots i.on{background:#0095f6}
.acoes{display:flex;gap:16px;padding:10px 12px 4px}.acoes svg{width:26px;height:26px}.acoes .salvar{margin-left:auto}
.leg{padding:4px 12px 16px;font-size:14px;line-height:1.45;white-space:pre-line;word-wrap:break-word}
.leg b{margin-right:5px}.leg .mais{color:#737373;cursor:pointer;white-space:nowrap}
.leg.curta .resto{display:none}
.tela{position:relative;width:100%;max-width:420px;aspect-ratio:9/16;max-height:calc(100vh - 90px);background:#000;border-radius:14px;overflow:hidden;margin-bottom:20px}
.tela img,.tela video{width:100%;height:100%;object-fit:cover;display:block}
.tela::before{content:'';position:absolute;left:0;right:0;top:0;height:110px;background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,0));z-index:1;pointer-events:none}
.tela .barras{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:3px;z-index:2}.tela .barras i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.9)}
.tela .cab{position:absolute;top:18px;left:12px;display:flex;align-items:center;gap:8px;color:#fff;font-size:13px;font-weight:700;z-index:2;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.tela .cab img{width:30px;height:30px;border-radius:50%}
.play{position:absolute;inset:0;display:grid;place-items:center;z-index:3;cursor:pointer;background:rgba(0,0,0,.18)}
.play div{width:84px;height:84px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center}
.play svg{width:38px;height:38px;margin-left:5px}
.som{position:absolute;right:12px;bottom:14px;z-index:4;width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;cursor:pointer}
.som svg{width:22px;height:22px}
.reel-leg{position:absolute;left:12px;right:64px;bottom:14px;color:#fff;font-size:13px;line-height:1.4;z-index:3;text-shadow:0 1px 4px rgba(0,0,0,.8);white-space:pre-line;max-height:40%;overflow-y:auto}
.reel-leg.curta .resto{display:none}.reel-leg .mais{opacity:.75;cursor:pointer}
.semprev{color:#bbb;text-align:center;padding:60px 20px;font-size:14px}
.vw-link{color:#fff;font-weight:700;font-size:14px;margin:-8px 0 26px;text-decoration:underline}
footer{color:var(--sub);font-size:12px;text-align:center;margin-top:24px}
</style></head><body>

<script id="dados" type="application/json">{"itens": [{"q": "2026-10-10T10:30:00Z", "h": "2026-10-10 07:30", "t": "story", "r": "Bom dia pra quem vai treinar hoje mesmo sem vontade. É nesses dias que o resultado acontece.", "m": "m/2026-10-10_01_story_bomdia.jpg", "s": "publicado", "e": "2026-10-10T11:50:43.077463+00:00", "l": "", "a": ["p/2026-10-10/01_story_bomdia.jpg"], "g": ""}, {"q": "2026-10-10T12:00:00Z", "h": "2026-10-10 09:00", "t": "imagem", "r": "Eu tentando entender como a pessoa treina 1 semana, não vê o abdômen trincado e desiste:", "m": "m/2026-10-10_02_meme_nazare.jpg", "s": "publicado", "e": "2026-10-10T12:01:39.344438+00:00", "l": "https://www.instagram.com/p/DeUCT7pm7NF/", "a": ["p/2026-10-10/02_meme_nazare.jpg"], "g": "Marca aquela amiga que desiste na primeira semana.\n\nO corpo não muda em 7 dias. Ele muda no que você repete por 7 semanas, 7 meses.\n\nQuem para cedo demais nunca chega a ver o resultado. Quem continua, vê.\n\nPrecisa de motivação e direção nos treinos? Quer eliminar 5, 10, 15 ou 20 kg ou mais ainda em 2026, mesmo treinando em casa?\nEu consigo te ajudar.\nVisite o meu perfil, clique no link azul e fale comigo no WhatsApp para eu te explicar como funciona a minha consultoria fitness online.\n\n#treinoemcasa\n#semdesculpas\n#consultoriafitness\n#personalonline\n#emagrecimentosaudavel"}, {"q": "2026-10-10T15:00:00Z", "h": "2026-10-10 12:00", "t": "story", "r": "Você já começou um treino e parou na segunda semana? Me responde no direct: Já, várias vezes ou Nunca nem comecei?", "m": "m/2026-10-10_03_story_enquete.jpg", "s": "publicado", "e": "2026-10-10T15:01:47.660872+00:00", "l": "https://www.instagram.com/stories/treinadorwm/4004926789718658496", "a": ["p/2026-10-10/03_story_enquete.jpg"], "g": ""}, {"q": "2026-10-10T15:30:00Z", "h": "2026-10-10 12:30", "t": "imagem", "r": "Você não precisa de mais motivação. Precisa de um treino que caiba no seu dia. Motivação acaba na segunda semana. Rotina não.", "m": "m/2026-10-10_04_reflexao_motivacao.jpg", "s": "publicado", "e": "2026-10-10T15:31:45.501498+00:00", "l": "https://www.instagram.com/p/DeUaWwtEUcB/", "a": ["p/2026-10-10/04_reflexao_motivacao.jpg"], "g": "Toda segunda-feira começa com muita motivação. Na quarta ela já foi embora.\n\nE tá tudo bem. Ninguém acorda motivado todo dia, nem eu.\n\nO que segura o resultado é uma rotina simples, que cabe no seu dia mesmo quando a vontade não aparece. Por isso treino curto, em casa, no seu horário, funciona melhor do que o plano perfeito que você abandona.\n\nPrecisa de motivação e direção nos treinos? Quer eliminar 5, 10, 15 ou 20 kg ou mais ainda em 2026, mesmo treinando em casa?\nEu consigo te ajudar.\nVisite o meu perfil, clique no link azul e fale comigo no WhatsApp para eu te explicar como funciona a minha consultoria fitness online.\n\n#treinoemcasa\n#semdesculpas\n#consultoriafitness\n#personalonline\n#emagrecimentosaudavel"}, {"q": "2026-10-10T18:00:00Z", "h": "2026-10-10 15:00", "t": "imagem", "r": "Eu ajudo mulheres a emagrecer em casa usando os movimentos das lutas. Sem academia. Sem dieta maluca. Com treino curto e acompanhamento de perto.", "m": "m/2026-10-10_05_foto_apresentacao.jpg", "s": "publicado", "e": "2026-10-10T18:01:47.874625+00:00", "l": "https://www.instagram.com/p/DeUrhnTnW1R/", "a": ["p/2026-10-10/05_foto_apresentacao.jpg"], "g": "Muita gente nova chegou por aqui essa semana, então deixa eu me apresentar.\n\nSou o Wilson, faixa preta de kickboxing e treinador há 10 anos. Também sou treinador na Hook Escola de Lutas.\n\nCriei o Método Hook pra mulher que já tentou de tudo e sempre parou: academia, dieta restritiva, caminhada. Usando os movimentos das lutas, o treino fica curto, intenso e divertido, e dá pra fazer na sala de casa.\n\nSe você chegou agora, seja bem-vinda. Aqui você vai aprender a emagrecer sem sofrimento.\n\nPrecisa de motivação e direção nos treinos? Quer eliminar 5, 10, 15 ou 20 kg ou mais ainda em 2026, mesmo treinando em casa?\nEu consigo te ajudar.\nVisi <script>
const D=JSON.parse(document.getElementById('dados').textContent);
const TIPO={story:'Story',story_video:'Story vídeo',imagem:'Feed',carrossel:'Carrossel',reel:'Reel'};
const DS=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const brt=d=>new Date(d.getTime()-3*3600e3); // Brasília = UTC-3 (sem horário de verão)
const dia=s=>s.slice(0,10), hm=iso=>{const b=brt(new Date(iso));return String(b.getUTCHours()).padStart(2,'0')+':'+String(b.getUTCMinutes()).padStart(2,'0')};
let filtro='hoje';try{filtro=localStorage.getItem('f')||'hoje'}catch(e){}
function status(i,agora){
  if(i.s==='publicado')return['ok','✓ Publicado '+hm(i.e)];
  if(i.s==='pulado_atraso')return['skip','Pulado'];
  const q=new Date(i.q);
  if(agora-q>40*60e3)return['late','Atrasado'];
  if(agora>=q)return['wait','Saindo agora'];
  return['wait','Agendado'];
}
function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.textContent=h;return e}
function render(){
  const agora=new Date(),hoje=brt(agora).toISOString().slice(0,10);
  const it=D.itens;
  const AV=document.getElementById('avisos');AV.innerHTML='';
  for(const l of (D.lembretes||[])){if(hoje>=l.aviso_desde&&hoje<=l.vence){
    const falta=Math.round((new Date(l.vence+'T12:00:00Z')-new Date(hoje+'T12:00:00Z'))/864e5);
    const a=el('div','aviso');a.append(el('b','','Lembrete: '+l.titulo),el('span','',l.texto+(falta>=0?' (vence em '+falta+(falta===1?' dia)':' dias)'):'')));AV.append(a)}}
  const pubs=it.filter(i=>i.s==='publicado').length;
  document.getElementById('sPub').textContent=pubs;
  document.getElementById('sFal').textContent=it.filter(i=>!i.s).length;
  document.getElementById('sHoje').textContent=it.filter(i=>dia(i.h)===hoje).length;
  document.getElementById('barra').style.width=(100*pubs/it.length)+'%';
  const g=new Date(D.gerado);
  document.getElementById('atual').textContent='Última atualização do robô: '+hm(D.gerado)+' · '+brt(g).toISOString().slice(8,10)+'/'+brt(g).toISOString().slice(5,7);
  const prox=it.find(i=>!i.s&&new Date(i.q)>agora-40*60e3);
  const P=document.getElementById('prox');P.innerHTML='';
  if(prox){const mins=Math.round((new Date(prox.q)-agora)/60e3);
    if(prox.m){const im=el('img');im.src=prox.m;im.alt='';P.append(im)}
    const c=el('div');c.append(el('div','k','Próxima postagem'));
    const quando=dia(prox.h)===hoje?'hoje':prox.h.slice(8,10)+'/'+prox.h.slice(5,7);
    c.append(el('div','v',prox.h.slice(11)+' '+quando+' · '+TIPO[prox.t]+(mins>0?' · em '+(mins>=60?Math.floor(mins/60)+'h'+String(mins%60).padStart(2,'0'):mins+' min'):'')));
    c.append(el('div','r',prox.r));P.append(c);
  }else{P.append(el('div','v','Todas as postagens foram concluídas'))}
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.f===filtro));
  let lista=it;
  if(filtro==='hoje')lista=it.filter(i=>dia(i.h)===hoje);
  if(filtro==='prox')lista=it.filter(i=>!i.s);
  if(filtro==='pub')lista=it.filter(i=>i.s==='publicado').slice().reverse();
  if(filtro.startsWith('dia:'))lista=it.filter(i=>dia(i.h)===filtro.slice(4));
  desenharDias(hoje);
  if(aberto<0)listaAtual=lista;
  const L=document.getElementById('lista');L.innerHTML='';
  if(!lista.length){L.append(el('div','vazio',filtro==='hoje'?'Nada programado para hoje.':'Nada por aqui ainda.'));return}
  let atual='',bloco;
  for(const i of lista){
    const d=dia(i.h);
    if(d!==atual){atual=d;bloco=el('section','dia');const dt=new Date(d+'T12:00:00Z');
      bloco.append(el('h2',d===hoje?'hoje':'',(d===hoje?'Hoje · ':'')+DS[dt.getUTCDay()]+', '+d.slice(8,10)+'/'+d.slice(5,7)));L.append(bloco)}
    if(!bloco.dataset.lem){bloco.dataset.lem=1;for(const l of (D.lembretes||[]))if(l.dia===d){const k=el('div','lemb');k.append(el('b','','Lembrete: '+l.titulo),el('span','',l.texto));bloco.append(k)}}
    const c=el('div','it');c.dataset.i=D.itens.indexOf(i);
    const im=el('img');if(i.m)im.src=i.m;im.alt='';im.loading='lazy';c.append(im);
    const b=el('div','c'),top=el('div','top');
    top.append(el('span','hr',i.h.slice(11)),el('span','tp '+i.t,TIPO[i.t]));
    const [cl,tx]=status(i,agora);top.append(el('span','st '+cl,tx));
    b.append(top,el('div','r',i.r));
    if(i.l){const a=el('a','lk','Ver no Instagram →');a.href=i.l;a.target='_blank';a.rel='noopener';a.addEventListener('click',e=>e.stopPropagation());b.append(a)}
    c.append(b);bloco.append(c);
  }
}
function desenharDias(hoje){
  const C=document.getElementById('dias');
  const dias=[...new Set(D.itens.map(i=>dia(i.h)))];
  if(!C.childElementCount){
    const AB=['dom','seg','ter','qua','qui','sex','sáb'];
    for(const d of dias){const b=document.createElement('button');b.dataset.f='dia:'+d;
      const dt=new Date(d+'T12:00:00Z');b.append(el('small','',AB[dt.getUTCDay()]),el('b','',d.slice(8,10)),el('i'));C.append(b)}
    C.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;filtro=b.dataset.f;try{localStorage.setItem('f',filtro)}catch(x){}render()});
  }
  C.querySelectorAll('button').forEach(b=>{const d=b.dataset.f.slice(4);const doDia=D.itens.filter(i=>dia(i.h)===d);
    const feitos=doDia.filter(i=>i.s==='publicado').length;
    b.querySelector('i').textContent=feitos+'/'+doDia.length;
    b.classList.toggle('feito',feitos===doDia.length);b.classList.toggle('lem',(D.lembretes||[]).some(l=>l.dia===d));b.classList.toggle('hj',d===hoje);
    b.classList.toggle('on',filtro==='dia:'+d||(filtro==='hoje'&&d===hoje))});
  if(!C.dataset.rolou){const alvo=C.querySelector('button.on')||C.querySelector('button.hj');
    if(alvo){C.scrollLeft=alvo.offsetLeft-C.offsetWidth/2+alvo.offsetWidth/2;C.dataset.rolou=1}}
}
// ---------- visualizador: abre a postagem como vai ficar no Instagram ----------
let listaAtual=[],aberto=-1;
const ICO={
  play:'<svg viewBox="0 0 24 24" fill="#fff"><path d="M7 4.5v15l13-7.5z"/></svg>',
  som:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg>',
  mudo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>',
  curtir:'<svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.9"><path d="M12 20s-7-4.4-9-8.6C1.6 8.4 3.6 5 7 5c2 0 3.3 1.1 5 3 1.7-1.9 3-3 5-3 3.4 0 5.4 3.4 4 6.4C19 15.6 12 20 12 20z"/></svg>',
  coment:'<svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.9" stroke-linejoin="round"><path d="M20.5 12a8.5 8.5 0 01-12.6 7.4L3.5 20.5l1.1-4.2A8.5 8.5 0 1120.5 12z"/></svg>',
  enviar:'<svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.9" stroke-linejoin="round"><path d="M21.5 3L10 14M21.5 3l-7 18-4.5-7-7-4.5z"/></svg>',
  salvar:'<svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.9" stroke-linejoin="round"><path d="M6 3.5h12v17l-6-4.5-6 4.5z"/></svg>'
};
function legenda(cls,texto){ // legenda com "mais", como no Instagram
  const d=el('div',cls+' curta');
  if(cls==='leg'){d.append(el('b','','treinadorwm'))}
  const corte=texto.indexOf('\n')>0&&texto.indexOf('\n')<120?texto.indexOf('\n'):Math.min(texto.length,120);
  d.append(el('span','',texto.slice(0,corte)));
  if(corte<texto.length){const r=el('span','resto',texto.slice(corte));const m=el('span','mais',' ... mais');
    m.onclick=e=>{e.stopPropagation();d.classList.remove('curta');m.remove()};d.append(m,r)}
  return d;
}
function semPrevia(i){const s=el('div','semprev','Prévia não disponível para esta postagem.');return s}
function telaVideo(i,src){
  const t=el('div','tela');const v=document.createElement('video');v.src=src;v.playsInline=true;v.preload='metadata';v.loop=true;
  v.setAttribute('playsinline','');v.onerror=()=>{t.replaceWith(semPrevia(i))};t.append(v);
  if(i.t==='story_video'){const b=el('div','barras');b.append(el('i'));const c=el('div','cab');const a=el('img');a.src='p/avatar.jpg';c.append(a,el('span','','treinadorwm'));t.append(b,c)}
  if(i.t==='reel'&&i.g)t.append(legenda('reel-leg',i.g));
  const p=el('div','play');p.innerHTML='<div>'+ICO.play+'</div>';
  const s=el('button','som');s.innerHTML=ICO.som;s.setAttribute('aria-label','Som');
  const atualizaSom=()=>{s.innerHTML=v.muted?ICO.mudo:ICO.som};
  p.onclick=()=>{v.muted=false;v.play();p.style.display='none';atualizaSom()};
  v.onclick=()=>{if(v.paused){v.play();p.style.display='none'}else{v.pause();p.style.display='grid'}};
  s.onclick=e=>{e.stopPropagation();v.muted=!v.muted;atualizaSom()};
  t.append(p,s);return t;
}
function telaStory(i,src){
  const t=el('div','tela');const im=el('img');im.src=src;im.alt='';im.onerror=()=>{t.replaceWith(semPrevia(i))};
  const b=el('div','barras');b.append(el('i'));const c=el('div','cab');const a=el('img');a.src='p/avatar.jpg';c.append(a,el('span','','treinadorwm'));
  t.append(im,b,c);return t;
}
function postFeed(i){
  const p=el('div','post');const h=el('div','post-h');const a=el('img');a.src='p/avatar.jpg';a.alt='';
  const n=el('div');n.append(el('b','','treinadorwm'));h.append(a,n);p.append(h);
  const cc=el('div','ccont');const car=el('div','carr');
  i.a.forEach(src=>{const im=el('img');im.src=src;im.alt='';im.loading='lazy';im.onerror=()=>{im.replaceWith(semPrevia(i))};car.append(im)});
  cc.append(car);p.append(cc);
  if(i.a.length>1){const ct=el('div','cont','1/'+i.a.length);cc.append(ct);const ds=el('div','dots');i.a.forEach((_,k)=>ds.append(el('i',k?'':'on')));p.append(ds);
    car.addEventListener('scroll',()=>{const k=Math.round(car.scrollLeft/car.clientWidth);ct.textContent=(k+1)+'/'+i.a.length;ds.querySelectorAll('i').forEach((d,j)=>d.classList.toggle('on',j===k))})}
  const ac=el('div','acoes');ac.innerHTML=ICO.curtir+ICO.coment+ICO.enviar+'<span class="salvar">'+ICO.salvar+'</span>';p.append(ac);
  if(i.g)p.append(legenda('leg',i.g));
  return p;
}
function abrir(k){
  aberto=k;const i=listaAtual[k];if(!i)return;
  document.querySelectorAll('.vw video').forEach(v=>v.pause());
  const dt=new Date(dia(i.h)+'T12:00:00Z');
  const [,tx]=status(i,new Date());
  const info=document.getElementById('vwInfo');info.innerHTML='';
  info.append(el('b','',TIPO[i.t]+' · '+i.h.slice(11)),el('span','',DS[dt.getUTCDay()]+', '+i.h.slice(8,10)+'/'+i.h.slice(5,7)+' · '+tx));
  const C=document.getElementById('vwCorpo');C.innerHTML='';
  const src=(i.a||[])[0];
  if(!src)C.append(semPrevia(i));
  else if(i.t==='reel'||i.t==='story_video')C.append(telaVideo(i,src));
  else if(i.t==='story')C.append(telaStory(i,src));
  else C.append(postFeed(i));
  if(i.l){const a=el('a','vw-link','Ver no Instagram →');a.href=i.l;a.target='_blank';a.rel='noopener';C.append(a)}
  document.getElementById('vwAnt').disabled=k<=0;document.getElementById('vwProx').disabled=k>=listaAtual.length-1;
  const V=document.getElementById('vw');if(!V.classList.contains('on'))history.pushState({vw:1},'');V.classList.add('on');V.scrollTop=0;document.body.style.overflow='hidden';
}
function fechar(){document.querySelectorAll('.vw video').forEach(v=>v.pause());document.getElementById('vw').classList.remove('on');document.body.style.overflow='';aberto=-1}
document.getElementById('lista').addEventListener('click',e=>{const c=e.target.closest('.it');if(!c)return;const i=D.itens[+c.dataset.i];abrir(listaAtual.indexOf(i))});
document.getElementById('prox').addEventListener('click',()=>{const agora=new Date();const p=D.itens.find(i=>!i.s&&new Date(i.q)>agora-40*60e3);if(p){listaAtual=[p];abrir(0)}});
document.getElementById('vwFechar').onclick=()=>{if(history.state&&history.state.vw)history.back();else fechar()};
document.getElementById('vwAnt').onclick=()=>abrir(aberto-1);
document.getElementById('vwProx').onclick=()=>abrir(aberto+1);
document.addEventListener('keydown',e=>{if(aberto<0)return;if(e.key==='Escape')fechar();if(e.key==='ArrowLeft'&&aberto>0)abrir(aberto-1);if(e.key==='ArrowRight'&&aberto<listaAtual.length-1)abrir(aberto+1)});
window.addEventListener('popstate',()=>{if(aberto>=0)fechar()});
document.getElementById('tabs').addEventListener('click',e=>{const f=e.target.dataset.f;if(!f)return;filtro=f;try{localStorage.setItem('f',f)}catch(x){}render();window.scrollTo({top:0})});
render();setInterval(render,60e3);
// recarrega a cada 5 min para pegar o que o robô publicou, mas nunca com uma postagem aberta
setInterval(()=>{if(aberto<0)location.reload()},300e3);
</script></body></html>
